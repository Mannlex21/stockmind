<div class="min-h-screen bg-[#0f0f11] text-zinc-100 flex flex-col md:flex-row">
  <!-- TOPBAR MÓVIL -->
  <header
    class="md:hidden flex items-center justify-between p-4 bg-zinc-900/80 border-b border-zinc-800 backdrop-blur-md sticky top-0 z-50"
  >
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 bg-emerald-900 text-emerald-400 font-bold flex items-center justify-center rounded-lg"
      >
        S
      </div>
      <span class="text-lg font-bold text-white tracking-tight">StockMind</span>
    </div>
    <button (click)="toggleMobileMenu()" class="text-zinc-400 hover:text-white p-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16m-7 6h7"
        ></path>
      </svg>
    </button>
  </header>

  <!-- SIDEBAR (Escritorio + Drawer Móvil) -->
  <aside
    class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-zinc-900/60 border-r border-zinc-800/80 p-5 flex flex-col justify-between transition-transform duration-200 backdrop-blur-md"
    [class.translate-x-0]="isMobileMenuOpen()"
    [class.-translate-x-full]="!isMobileMenuOpen()"
    [class.md:translate-x-0]="true"
  >
    <div class="flex flex-col gap-8">
      <!-- Logo -->
      <div class="hidden md:flex items-center gap-3 px-2">
        <div
          class="w-9 h-9 bg-emerald-950 border border-emerald-800/50 text-emerald-400 font-bold text-xl flex items-center justify-center rounded-lg shadow-lg shadow-emerald-950/50"
        >
          S
        </div>
        <div>
          <span class="text-lg font-bold text-white tracking-tight block leading-none"
            >StockMind</span
          >
          <span class="text-[10px] text-emerald-500 font-medium uppercase tracking-wider"
            >Logística IA</span
          >
        </div>
      </div>

      <!-- Navegación -->
      <nav class="flex flex-col gap-1.5">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-emerald-950/60 text-emerald-400 border-emerald-800/50 font-semibold"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="closeMobileMenu()"
            class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-all border border-transparent cursor-pointer"
          >
            <!-- Iconos genéricos SVG -->
            @switch (item.icon) {
              @case ('dashboard') {
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
                  ></path>
                </svg>
              }
              @case ('box') {
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
                  ></path>
                </svg>
              }
              @case ('scan') {
                <svg
                  class="w-5 h-5 shrink-0 text-emerald-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"
                  ></path>
                </svg>
              }
              @case ('shopping-cart') {
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"
                  ></path>
                </svg>
              }
              @case ('settings') {
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                  ></path>
                </svg>
              }
            }

            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </div>

    <!-- Perfil del usuario / Salir -->
    <div class="pt-4 border-t border-zinc-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center font-bold text-xs text-white"
        >
          M
        </div>
        <div class="flex flex-col">
          <span class="text-xs font-medium text-white">Mi Empresa</span>
          <span class="text-[10px] text-zinc-500">Plan Pro</span>
        </div>
      </div>
      <a
        routerLink="/"
        class="text-zinc-500 hover:text-rose-400 p-1.5 transition-colors"
        title="Cerrar sesión"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          ></path>
        </svg>
      </a>
    </div>
  </aside>

  <!-- Overlay para cerrar el menú en móviles -->
  @if (isMobileMenuOpen()) {
    <div
      (click)="closeMobileMenu()"
      class="fixed inset-0 bg-black/60 z-30 md:hidden backdrop-blur-xs"
    ></div>
  }

  <!-- ÁREA DE CONTENIDO PRINCIPAL -->
  <main class="flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>
</div>
