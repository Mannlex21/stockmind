<div class="min-h-screen flex items-center justify-center p-4 w-full">
  <div
    class="w-full max-w-md bg-zinc-900/50 border border-zinc-800 rounded-2xl p-8 shadow-2xl backdrop-blur-sm"
  >
    <!-- Logo y Título -->
    <div class="flex flex-col items-center mb-8">
      <div
        class="w-12 h-12 bg-emerald-900 text-emerald-500 font-bold text-xl flex items-center justify-center rounded-lg mb-4 shadow-lg shadow-emerald-900/20"
      >
        S
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Bienvenido de nuevo</h2>
      <p class="text-sm text-zinc-400 mt-2">Ingresa a tu panel de control de StockMind</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-zinc-300">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@empresa.com"
          class="w-full bg-zinc-950 border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder:text-zinc-600"
        />
      </div>

      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label for="password" class="text-sm font-medium text-zinc-300">Contraseña</label>
          <a href="#" class="text-xs text-emerald-500 hover:text-emerald-400"
            >¿Olvidaste tu contraseña?</a
          >
        </div>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full bg-zinc-950 border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder:text-zinc-600"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading()"
        class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-emerald-800 disabled:text-zinc-400 text-white font-semibold py-3 px-4 rounded-lg transition-colors mt-2 shadow-[0_0_15px_rgba(5,150,105,0.2)] flex justify-center items-center gap-2"
      >
        @if (isLoading()) {
          <span
            class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"
          ></span>
          Iniciando sesión...
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>

    <div class="mt-8 text-center text-sm text-zinc-400">
      ¿No tienes una cuenta?
      <a
        routerLink="/register"
        class="text-emerald-500 hover:text-emerald-400 font-medium cursor-pointer"
        >Regístrate gratis</a
      >
    </div>
  </div>
</div>
