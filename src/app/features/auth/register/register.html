<div class="min-h-screen flex items-center justify-center p-4 w-full">
  <div
    class="w-full max-w-lg bg-zinc-900/50 border border-zinc-800 rounded-2xl p-8 shadow-2xl backdrop-blur-sm"
  >
    <!-- Logo y Título -->
    <div class="flex flex-col items-center mb-8">
      <h2 class="text-2xl font-bold text-white tracking-tight">Crea tu cuenta en StockMind</h2>
      <p class="text-sm text-zinc-400 mt-2">Comienza a gestionar tu inventario con IA</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col sm:flex-row gap-4">
        <div class="flex flex-col gap-2 w-full">
          <label for="companyName" class="text-sm font-medium text-zinc-300"
            >Nombre de la Empresa</label
          >
          <input
            id="companyName"
            type="text"
            formControlName="companyName"
            placeholder="Logística S.A."
            class="w-full bg-zinc-950 border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder:text-zinc-600"
          />
        </div>

        <div class="flex flex-col gap-2 w-full">
          <label for="fullName" class="text-sm font-medium text-zinc-300">Tu Nombre</label>
          <input
            id="fullName"
            type="text"
            formControlName="fullName"
            placeholder="Ej. Juan Pérez"
            class="w-full bg-zinc-950 border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder:text-zinc-600"
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-zinc-300"
          >Correo Electrónico de Trabajo</label
        >
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="juan@empresa.com"
          class="w-full bg-zinc-950 border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder:text-zinc-600"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="password" class="text-sm font-medium text-zinc-300">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
          class="w-full bg-zinc-950 border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder:text-zinc-600"
        />
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid || isLoading()"
        class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-emerald-800 disabled:text-zinc-400 text-white font-semibold py-3 px-4 rounded-lg transition-colors mt-4 shadow-[0_0_15px_rgba(5,150,105,0.2)] flex justify-center items-center gap-2"
      >
        @if (isLoading()) {
          <span
            class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"
          ></span>
          Creando cuenta...
        } @else {
          Comenzar Gratis
        }
      </button>
    </form>

    <div class="mt-8 text-center text-sm text-zinc-400">
      ¿Ya tienes una cuenta?
      <a
        routerLink="/login"
        class="text-emerald-500 hover:text-emerald-400 font-medium cursor-pointer"
        >Inicia sesión aquí</a
      >
    </div>
  </div>
</div>
