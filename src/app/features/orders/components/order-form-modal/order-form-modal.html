<!-- order-form-modal.component.html -->
@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div
      class="w-full max-w-3xl bg-zinc-950 border border-zinc-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]"
    >
      <!-- Header -->
      <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
        <h2 class="text-xl font-bold text-white">
          {{ orderToEdit() ? 'Editar Órden de Compra' : 'Nueva Órden de Compra' }}
        </h2>
        <button (click)="closeModal.emit()" class="text-zinc-400 hover:text-white text-xl">
          &times;
        </button>
      </div>

      <!-- Body -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 overflow-y-auto space-y-6 flex-1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2"
              >Proveedor</label
            >
            <input
              type="text"
              formControlName="supplier"
              placeholder="Nombre del proveedor"
              class="w-full px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-white text-sm focus:outline-none focus:border-zinc-700"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2"
              >Estado</label
            >
            <select
              formControlName="status"
              class="w-full px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-white text-sm focus:outline-none focus:border-zinc-700"
            >
              <option value="draft">Borrador</option>
              <option value="sent">Enviada</option>
              <option value="completed">Completada</option>
              <option value="cancelled">Cancelada</option>
            </select>
          </div>
        </div>

        <!-- Items Table Array -->
        <div>
          <div class="flex justify-between items-center mb-3">
            <label class="text-xs font-semibold uppercase tracking-wider text-zinc-400"
              >Partidas de la Órden</label
            >
            <button
              type="button"
              (click)="addItem()"
              class="px-3 py-1 text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 text-emerald-400 rounded-lg border border-zinc-700"
            >
              + Agregar Producto
            </button>
          </div>

          <div formArrayName="items" class="space-y-3">
            @for (itemGroup of items.controls; track $index) {
              <div
                [formGroupName]="$index"
                class="grid grid-cols-12 gap-2 items-center bg-zinc-900/50 p-3 rounded-xl border border-zinc-800"
              >
                <input
                  type="text"
                  formControlName="productName"
                  placeholder="Producto"
                  class="col-span-5 px-3 py-1.5 bg-zinc-950 border border-zinc-800 rounded text-xs text-white"
                />
                <input
                  type="number"
                  formControlName="quantityToOrder"
                  placeholder="Cant."
                  class="col-span-2 px-3 py-1.5 bg-zinc-950 border border-zinc-800 rounded text-xs text-white"
                />
                <input
                  type="number"
                  formControlName="estimatedCost"
                  placeholder="Costo U."
                  class="col-span-3 px-3 py-1.5 bg-zinc-950 border border-zinc-800 rounded text-xs text-white"
                />
                <button
                  type="button"
                  (click)="removeItem($index)"
                  class="col-span-2 px-2 py-1.5 bg-rose-950/40 text-rose-400 border border-rose-900/50 rounded text-xs hover:bg-rose-900/60"
                >
                  Quitar
                </button>
              </div>
            }
          </div>
        </div>

        <!-- Total preview -->
        <div class="flex justify-end pt-2 border-t border-zinc-800">
          <p class="text-sm font-semibold text-zinc-400">
            Total Estimado:
            <span class="text-lg text-emerald-400 font-bold ml-2"
              >${{ calculateTotal() | number: '1.2-2' }}</span
            >
          </p>
        </div>
      </form>

      <!-- Footer -->
      <div class="p-4 border-t border-zinc-800 bg-zinc-900/30 flex justify-end gap-3">
        <button
          type="button"
          (click)="closeModal.emit()"
          class="px-4 py-2 text-xs font-semibold text-zinc-400 hover:text-white rounded-lg border border-zinc-800"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="onSubmit()"
          class="px-4 py-2 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-colors"
        >
          Guardar Órden
        </button>
      </div>
    </div>
  </div>
}
