<!-- order-kpis.component.html -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
  <div class="p-4 rounded-xl bg-zinc-900/50 border border-zinc-800 backdrop-blur-md">
    <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Total Órdenes</p>
    <p class="text-2xl font-bold text-white mt-1">{{ stats().totalOrders }}</p>
  </div>
  <div class="p-4 rounded-xl bg-zinc-900/50 border border-zinc-800 backdrop-blur-md">
    <p class="text-xs font-semibold uppercase tracking-wider text-amber-400">Borradores</p>
    <p class="text-2xl font-bold text-white mt-1">{{ stats().draftCount }}</p>
  </div>
  <div class="p-4 rounded-xl bg-zinc-900/50 border border-zinc-800 backdrop-blur-md">
    <p class="text-xs font-semibold uppercase tracking-wider text-blue-400">Enviadas</p>
    <p class="text-2xl font-bold text-white mt-1">{{ stats().sentCount }}</p>
  </div>
  <div class="p-4 rounded-xl bg-zinc-900/50 border border-zinc-800 backdrop-blur-md">
    <p class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Completadas</p>
    <p class="text-2xl font-bold text-white mt-1">{{ stats().completedCount }}</p>
  </div>
  <div class="p-4 rounded-xl bg-zinc-900/50 border border-zinc-800 backdrop-blur-md">
    <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Inversión Estimada</p>
    <p class="text-2xl font-bold text-emerald-400 mt-1">
      ${{ stats().totalEstimatedSpend | number: '1.2-2' }}
    </p>
  </div>
</div>
