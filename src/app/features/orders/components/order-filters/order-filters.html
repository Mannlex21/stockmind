<!-- order-filters.component.html -->
<div
  class="flex flex-col sm:flex-row gap-4 justify-between items-center bg-zinc-900/50 p-4 rounded-xl border border-zinc-800"
>
  <div class="w-full sm:w-80">
    <input
      type="text"
      [ngModel]="filter().search"
      (ngModelChange)="onSearchChange($event)"
      placeholder="Buscar por folio o proveedor..."
      class="w-full px-4 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-700"
    />
  </div>
  <div class="flex gap-2 overflow-x-auto w-full sm:w-auto">
    @for (opt of statusOptions; track opt.value) {
      <button
        type="button"
        (click)="onStatusChange(opt.value)"
        [class]="
          filter().status === opt.value
            ? 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'
            : 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-zinc-950 text-zinc-400 border border-zinc-800 hover:text-white'
        "
      >
        {{ opt.label }}
      </button>
    }
  </div>
</div>
