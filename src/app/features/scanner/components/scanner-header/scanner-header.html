<div
  class="flex flex-col md:flex-row md:items-center justify-between gap-6 border-b pb-6 border-zinc-800 mb-5"
>
  <div class="space-y-1">
    <h1 class="text-2xl font-bold text-white tracking-tight">Scanner & Captura de Facturas</h1>
    <p class="text-sm text-zinc-400">
      Escanea facturas con IA o realiza captura y verificación manual de inventario.
    </p>
  </div>

  <div class="flex items-center gap-3">
    <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wider"
      >Modo de Origen:</span
    >
    <span
      [class.bg-zinc-800]="entryMode() === 'MANUAL'"
      [class.text-zinc-300]="entryMode() === 'MANUAL'"
      [class.border-zinc-700]="entryMode() === 'MANUAL'"
      [class.bg-emerald-950]="entryMode() === 'AI_GENERATED'"
      [class.text-emerald-400]="entryMode() === 'AI_GENERATED'"
      [class.border-emerald-800\/50]="entryMode() === 'AI_GENERATED'"
      [class.bg-amber-950]="entryMode() === 'AI_EDITED'"
      [class.text-amber-400]="entryMode() === 'AI_EDITED'"
      [class.border-amber-800\/50]="entryMode() === 'AI_EDITED'"
      class="px-3.5 py-1.5 rounded-full text-xs font-medium border flex items-center gap-2 transition-colors shadow-sm"
    >
      <span
        [class.bg-zinc-400]="entryMode() === 'MANUAL'"
        [class.bg-emerald-400]="entryMode() === 'AI_GENERATED'"
        [class.bg-amber-400]="entryMode() === 'AI_EDITED'"
        class="w-2 h-2 rounded-full"
      ></span>
      {{
        entryMode() === 'MANUAL'
          ? 'Captura Manual'
          : entryMode() === 'AI_GENERATED'
            ? 'IA Generada'
            : 'IA con Edición Manual'
      }}
    </span>
  </div>
</div>
