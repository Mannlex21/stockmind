<div class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-6 backdrop-blur-sm space-y-6">
  <h2 class="font-semibold text-white text-base tracking-wide">Documento de Origen</h2>

  <div
    class="border-2 border-dashed border-zinc-700 hover:border-emerald-500 rounded-xl py-10 px-6 text-center transition-all cursor-pointer bg-zinc-950/40 relative group"
    (click)="fileInput.click()"
  >
    <input
      #fileInput
      type="file"
      accept="image/*,application/pdf"
      class="hidden"
      (change)="onFileChange($event)"
    />

    @if (!previewUrl() && !isScanning()) {
      <div class="space-y-4">
        <div
          class="w-14 h-14 bg-emerald-950 text-emerald-400 border border-emerald-800/50 rounded-full flex items-center justify-center mx-auto transition-transform group-hover:scale-110 shadow-lg"
        >
          📄
        </div>
        <div class="space-y-1">
          <p class="text-sm font-medium text-zinc-200">
            Arrastra tu factura aquí o <span class="text-emerald-400 underline">examina</span>
          </p>
          <p class="text-xs text-zinc-500">Soporta JPG, PNG, PDF</p>
        </div>
      </div>
    }

    @if (isScanning()) {
      <div class="py-8 space-y-4">
        <div
          class="animate-spin w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full mx-auto"
        ></div>
        <p class="text-sm text-emerald-400 font-medium tracking-wide">
          Analizando con Gemini AI...
        </p>
      </div>
    }

    @if (previewUrl() && !isScanning()) {
      <div class="relative p-2">
        <img
          [src]="previewUrl()"
          class="max-h-80 mx-auto rounded-lg border border-zinc-700 object-contain shadow-xl"
          alt="Vista previa"
        />
        <button
          (click)="$event.stopPropagation(); removeFile.emit()"
          class="absolute top-0 right-0 bg-rose-950 text-rose-300 border border-rose-800 hover:bg-rose-900 p-2 rounded-full text-xs shadow-md transition-colors cursor-pointer"
          title="Eliminar vista previa"
        >
          ✕
        </button>
      </div>
    }
  </div>

  <button
    type="button"
    (click)="fileInput.click()"
    class="w-full py-3 px-4 border border-zinc-700 rounded-lg text-sm text-zinc-300 hover:bg-zinc-800/60 hover:text-white flex items-center justify-center gap-2 font-medium transition-all cursor-pointer shadow-sm"
  >
    📷 Usar Cámara / Cambiar Archivo
  </button>
</div>
