<div
  class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-4 flex flex-col sm:flex-row items-center gap-4 justify-between backdrop-blur-sm"
>
  <div class="relative w-full sm:w-80">
    <input
      type="text"
      [ngModel]="store.searchQuery()"
      (ngModelChange)="store.searchQuery.set($event)"
      placeholder="Buscar por referencia, código, nombre, marca..."
      class="w-full bg-zinc-950 border border-zinc-800 text-white text-sm rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-emerald-500 transition-colors placeholder:text-zinc-600"
    />
    <svg
      class="w-4 h-4 text-zinc-500 absolute left-3 top-3"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
      ></path>
    </svg>
  </div>

  <div class="flex items-center gap-2 w-full sm:w-auto">
    <label class="text-xs text-zinc-400 whitespace-nowrap">Estado:</label>
    <select
      [ngModel]="store.selectedStatus()"
      (ngModelChange)="store.selectedStatus.set($event)"
      class="bg-zinc-950 border border-zinc-800 text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-500 w-full sm:w-auto"
    >
      <option value="ALL">Todos</option>
      <option value="IN_STOCK">En Stock</option>
      <option value="LOW_STOCK">Stock Bajo</option>
      <option value="OUT_OF_STOCK">Agotado</option>
    </select>
  </div>
</div>
