<div class="p-6 max-w-7xl mx-auto flex flex-col gap-6">
  <!-- Encabezado y Acciones Principales -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Gestión de Inventario ERP</h1>
      <p class="text-sm text-zinc-400">
        Control de stock, precios con/sin IVA, familias, subfamilias y trazabilidad contable.
      </p>
    </div>
    <div class="flex items-center gap-3">
      <button
        (click)="store.openProductModal()"
        class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center gap-2 shadow-lg shadow-emerald-900/20 cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          ></path>
        </svg>
        <span>Nuevo Artículo ERP</span>
      </button>
    </div>
  </div>

  <!-- Controles de Buscador y Filtros -->
  <app-inventory-filters />

  <!-- Tabla de Inventario ERP -->
  <app-inventory-table />

  <!-- Modales -->
  <app-inventory-product-modal />
  <app-inventory-return-modal />
</div>
