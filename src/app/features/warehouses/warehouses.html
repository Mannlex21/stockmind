<div class="p-6 flex flex-col gap-6 max-w-7xl mx-auto">
  <!-- Encabezado de Sección -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-white flex items-center gap-2.5">
        <svg lucideWarehouse class="w-7 h-7 text-indigo-400"></svg>
        Gestión de Almacenes
      </h1>
      <p class="text-sm text-zinc-400 mt-1">
        Administra ubicaciones físicas para el control de inventarios, recepción de compras y puntos
        de venta.
      </p>
    </div>

    <button
      (click)="store.openModal()"
      class="inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-lg font-medium shadow-sm transition-colors text-sm cursor-pointer shrink-0"
    >
      <svg lucidePlus class="w-4 h-4"></svg>
      <span>Nuevo Almacén</span>
    </button>
  </div>

  <!-- Mensaje de Error Banner -->
  @if (store.error()) {
    <div
      class="p-4 rounded-xl bg-rose-950/40 border border-rose-800/60 text-rose-300 flex items-center justify-between text-sm backdrop-blur-sm"
    >
      <div class="flex items-center gap-2">
        <svg lucideTriangleAlert class="w-5 h-5 flex-shrink-0 text-rose-400"></svg>
        <span>{{ store.error() }}</span>
      </div>
      <button
        (click)="store.loadWarehouses()"
        class="underline font-semibold hover:text-rose-100 transition-colors"
      >
        Reintentar
      </button>
    </div>
  }

  <!-- KPIs -->
  <app-warehouse-kpis
    class="block w-full"
    [total]="store.warehouses().length"
    [active]="store.totalActiveWarehouses()"
    [pos]="store.posEnabledWarehouses()"
  />

  <!-- Filtros -->
  <app-warehouse-filters
    class="block w-full"
    [(searchQuery)]="store.searchQuery"
    [(selectedStatus)]="store.selectedStatus"
  />

  <!-- Tabla -->
  <app-warehouse-table
    class="block w-full"
    [warehouses]="store.filteredWarehouses()"
    [isLoading]="store.isLoading()"
    (edit)="store.openModal($event)"
    (delete)="store.deleteWarehouse($event)"
    (toggleStatus)="store.toggleStatus($event)"
  />

  <!-- Modal -->
  <app-warehouse-form-modal
    [isOpen]="store.isModalOpen()"
    [form]="store.editingWarehouse()"
    [isLoading]="store.isLoading()"
    (close)="store.closeModal()"
    (save)="store.saveWarehouse()"
  />
</div>
