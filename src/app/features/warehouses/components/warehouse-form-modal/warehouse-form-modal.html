@if (isOpen()) {
  <div
    class="fixed inset-0 bg-zinc-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
  >
    <div
      class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in fade-in zoom-in-95 duration-150"
    >
      <!-- Header del Modal -->
      <div class="px-6 py-4 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5 text-white">
          <svg lucideWarehouse class="w-5 h-5 text-indigo-400"></svg>
          <h2 class="font-bold text-lg">
            {{ form()?.id ? 'Editar Almacén' : 'Nuevo Almacén' }}
          </h2>
        </div>
        <button
          (click)="close.emit()"
          class="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-zinc-800 transition-colors cursor-pointer"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>

      <!-- Body del Formulario -->
      @if (form(); as data) {
        <div class="p-6 space-y-4 overflow-y-auto text-zinc-300 text-sm">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label
                class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5"
              >
                Código *
              </label>
              <input
                type="text"
                [(ngModel)]="data.code"
                placeholder="EJ. BOD-01"
                class="w-full px-3 py-2 text-sm border border-zinc-800 rounded-lg bg-zinc-950/80 text-white placeholder-zinc-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 font-mono uppercase"
              />
            </div>
            <div class="sm:col-span-2">
              <label
                class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5"
              >
                Nombre *
              </label>
              <input
                type="text"
                [(ngModel)]="data.name"
                placeholder="ej. Bodega Principal"
                class="w-full px-3 py-2 text-sm border border-zinc-800 rounded-lg bg-zinc-950/80 text-white placeholder-zinc-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
              />
            </div>
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5"
            >
              Ubicación Física
            </label>
            <input
              type="text"
              [(ngModel)]="data.location"
              placeholder="ej. Pasillo 3, Planta Baja"
              class="w-full px-3 py-2 text-sm border border-zinc-800 rounded-lg bg-zinc-950/80 text-white placeholder-zinc-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5"
            >
              Descripción
            </label>
            <textarea
              [(ngModel)]="data.description"
              rows="2"
              placeholder="Notas adicionales..."
              class="w-full px-3 py-2 text-sm border border-zinc-800 rounded-lg bg-zinc-950/80 text-white placeholder-zinc-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
            ></textarea>
          </div>

          <div class="space-y-3 pt-3 border-t border-zinc-800">
            <label
              class="flex items-center justify-between cursor-pointer p-2 rounded-lg hover:bg-zinc-800/40 transition-colors"
            >
              <div>
                <span class="text-sm font-medium text-white block">Almacén Principal</span>
                <span class="text-xs text-zinc-500">Recibe compras automáticamente.</span>
              </div>
              <input
                type="checkbox"
                [(ngModel)]="data.isMain"
                class="w-4 h-4 text-indigo-600 rounded border-zinc-700 bg-zinc-950 focus:ring-indigo-500 focus:ring-offset-zinc-900"
              />
            </label>

            <label
              class="flex items-center justify-between cursor-pointer p-2 rounded-lg hover:bg-zinc-800/40 transition-colors"
            >
              <div>
                <span class="text-sm font-medium text-white block"
                  >Permitir Ventas Directas (TPV)</span
                >
                <span class="text-xs text-zinc-500">Permite descontar existencias en caja.</span>
              </div>
              <input
                type="checkbox"
                [(ngModel)]="data.allowSales"
                class="w-4 h-4 text-indigo-600 rounded border-zinc-700 bg-zinc-950 focus:ring-indigo-500 focus:ring-offset-zinc-900"
              />
            </label>
          </div>
        </div>
      }

      <!-- Footer del Modal -->
      <div
        class="px-6 py-4 border-t border-zinc-800 bg-zinc-950/50 flex items-center justify-end gap-3"
      >
        <button
          (click)="close.emit()"
          class="px-4 py-2 text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-colors cursor-pointer"
        >
          Cancelar
        </button>
        <button
          (click)="save.emit()"
          [disabled]="!form()?.name || !form()?.code || isLoading()"
          class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-lg transition-colors shadow-sm inline-flex items-center gap-2 cursor-pointer"
        >
          @if (isLoading()) {
            <svg lucideLoader class="w-4 h-4 animate-spin"></svg>
          }
          Guardar Almacén
        </button>
      </div>
    </div>
  </div>
}
