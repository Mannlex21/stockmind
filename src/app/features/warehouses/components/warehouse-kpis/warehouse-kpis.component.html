<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
  <!-- Total Almacenes -->
  <div
    class="bg-zinc-900/50 border border-zinc-800 p-4 rounded-xl backdrop-blur-sm shadow-sm flex items-center justify-between"
  >
    <div>
      <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Total Almacenes</p>
      <p class="text-2xl font-extrabold text-white mt-1">{{ total() }}</p>
    </div>
    <div
      class="w-10 h-10 rounded-lg bg-indigo-950/50 border border-indigo-800/50 text-indigo-400 flex items-center justify-center"
    >
      <svg lucideBuilding class="w-5 h-5"></svg>
    </div>
  </div>

  <!-- Almacenes Activos -->
  <div
    class="bg-zinc-900/50 border border-zinc-800 p-4 rounded-xl backdrop-blur-sm shadow-sm flex items-center justify-between"
  >
    <div>
      <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Almacenes Activos</p>
      <p class="text-2xl font-extrabold text-emerald-400 mt-1">{{ active() }}</p>
    </div>
    <div
      class="w-10 h-10 rounded-lg bg-emerald-950/50 border border-emerald-800/50 text-emerald-400 flex items-center justify-center"
    >
      <svg lucideCircleCheck class="w-5 h-5"></svg>
    </div>
  </div>

  <!-- Habilitados TPV -->
  <div
    class="bg-zinc-900/50 border border-zinc-800 p-4 rounded-xl backdrop-blur-sm shadow-sm flex items-center justify-between"
  >
    <div>
      <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Habilitados TPV</p>
      <p class="text-2xl font-extrabold text-amber-400 mt-1">{{ pos() }}</p>
    </div>
    <div
      class="w-10 h-10 rounded-lg bg-amber-950/50 border border-amber-800/50 text-amber-400 flex items-center justify-center"
    >
      <svg lucideShoppingBag class="w-5 h-5"></svg>
    </div>
  </div>
</div>
